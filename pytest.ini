[pytest]
addopts = --order-scope=module
;addopts = -vs --alluredir ./report/temp -p no:warnings --clean-alluredir
;
;testpaths = ./testcase/

markers =
    smoke: 核心业务冒烟测试
    web: Playwright Web UI 自动化测试

filterwarnings =
    error
    ignore::UserWarning

python_files = test_*.py

python_classes = Test*

python_functions = test_*
