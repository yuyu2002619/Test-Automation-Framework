name: CI - Unit Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python 3.12 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v8

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run isolated framework unit tests
        run: >-
          uv run --no-sync python -m pytest
          --basetemp=.pytest-tmp-ci
          --confcutdir=tests/unit
          tests/unit -q
