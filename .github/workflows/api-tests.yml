name: API Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      verify_failure_artifact:
        description: Verify that artifacts are uploaded after a test failure
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pytest:
    name: Run pytest against mock API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            mock_server/api_server/uv.lock

      - name: Install Python runtimes
        run: uv python install 3.12 3.13

      - name: Install test framework dependencies
        run: uv sync --frozen --python 3.12

      - name: Install mock API dependencies
        run: uv sync --frozen --project mock_server/api_server --python 3.13

      - name: Start mock API and wait for readiness
        working-directory: mock_server/api_server/base
        run: |
          nohup ../.venv/bin/python flask_service.py > mock-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/index > /dev/null; then
              echo "Mock API is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Mock API did not become ready"
          cat mock-server.log
          exit 1

      - name: Run API tests
        shell: bash
        env:
          VERIFY_FAILURE_ARTIFACT: ${{ inputs.verify_failure_artifact }}
        run: |
          test_targets=(testcase)

          if [[ "$VERIFY_FAILURE_ARTIFACT" == "true" ]]; then
            mkdir -p .ci
            cat > .ci/test_ci_failure_probe.py <<'PY'
          def test_ci_failure_probe():
              assert False, "Intentional CI failure for artifact verification"
          PY
            test_targets+=(.ci/test_ci_failure_probe.py)
          fi

          .venv/bin/python -m pytest "${test_targets[@]}" -v \
            --junitxml=report/ci-results.xml

      - name: Write API test failure summary
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "## API test failure"
            echo
            echo "- Workflow: ${{ github.workflow }}"
            echo "- Branch: ${{ github.ref_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run ID: ${{ github.run_id }}"
            echo
            echo "Download the artifact to inspect the JUnit report and mock API log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            report/ci-results.xml
            mock_server/api_server/base/mock-server.log
          if-no-files-found: warn
          retention-days: 7
